<svg width="760" height="340" viewBox="0 0 760 340" xmlns="http://www.w3.org/2000/svg" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <filter id="glow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="3" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <linearGradient id="scan" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#00ff41" stop-opacity="0"/>
      <stop offset="50%" stop-color="#00ff41" stop-opacity="0.06"/>
      <stop offset="100%" stop-color="#00ff41" stop-opacity="0"/>
    </linearGradient>
    <pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse">
      <path d="M 24 0 L 0 0 0 24" fill="none" stroke="#00ff41" stroke-opacity="0.06" stroke-width="1"/>
    </pattern>
  </defs>

  <!-- terminal window -->
  <rect x="0" y="0" width="760" height="340" rx="6" fill="#000000"/>
  <rect x="0" y="0" width="760" height="340" rx="6" fill="url(#grid)"/>
  <rect x="0" y="0" width="760" height="28" rx="6" fill="#0a0f0a"/>
  <circle cx="18" cy="14" r="5" fill="#ff5f56"/>
  <circle cx="36" cy="14" r="5" fill="#ffbd2e"/>
  <circle cx="54" cy="14" r="5" fill="#27c93f"/>
  <text x="380" y="18" text-anchor="middle" font-family="Consolas, Menlo, monospace" font-size="11" fill="#4d5a4d">gravity_drift.exe — simulation preview (autoplay, non-interactive)</text>
  <line x1="0" y1="28" x2="760" y2="28" stroke="#00ff41" stroke-opacity="0.15"/>

  <!-- boot text -->
  <text x="16" y="48" font-family="Consolas, Menlo, monospace" font-size="12" fill="#00ff41" opacity="0.85">
    &gt; initializing gravity field...
    <animate attributeName="opacity" values="0;0.85;0.85" dur="0.6s" fill="freeze"/>
  </text>
  <text x="16" y="64" font-family="Consolas, Menlo, monospace" font-size="12" fill="#00ff41" opacity="0">
    &gt; spawning wells [3] cores [1]... OK
    <animate attributeName="opacity" values="0;0;0.85" dur="1.4s" fill="freeze"/>
  </text>

  <!-- gravity wells -->
  <g filter="url(#glow)">
    <circle cx="150" cy="180" r="10" fill="#00ff41" opacity="0.9">
      <animate attributeName="cy" values="180;172;180" dur="4s" repeatCount="indefinite"/>
    </circle>
    <circle cx="150" cy="180" r="34" fill="none" stroke="#00ff41" stroke-width="1" opacity="0.25">
      <animate attributeName="r" values="30;38;30" dur="3s" repeatCount="indefinite"/>
    </circle>

    <circle cx="470" cy="120" r="9" fill="#39ff6a" opacity="0.9">
      <animate attributeName="cy" values="120;128;120" dur="3.4s" repeatCount="indefinite"/>
    </circle>
    <circle cx="470" cy="120" r="30" fill="none" stroke="#39ff6a" stroke-width="1" opacity="0.22">
      <animate attributeName="r" values="26;34;26" dur="2.6s" repeatCount="indefinite"/>
    </circle>

    <circle cx="330" cy="250" r="8" fill="#00e63e" opacity="0.9">
      <animate attributeName="cx" values="330;338;330" dur="3.8s" repeatCount="indefinite"/>
    </circle>
    <circle cx="330" cy="250" r="26" fill="none" stroke="#00e63e" stroke-width="1" opacity="0.22">
      <animate attributeName="r" values="22;30;22" dur="3.1s" repeatCount="indefinite"/>
    </circle>
  </g>

  <!-- orbiting drones (particles) tracing gravity-assist loops around the wells -->
  <g filter="url(#glow)">
    <circle r="3.2" fill="#c8ffd6">
      <animateMotion dur="5.5s" repeatCount="indefinite"
        path="M 60,180 C 60,120 130,110 150,150 C 170,190 240,190 260,150 C 280,110 350,120 350,180 C 350,240 280,250 260,210 C 240,170 170,170 150,210 C 130,250 60,240 60,180 Z"/>
    </circle>

    <circle r="2.6" fill="#8dffb0">
      <animateMotion dur="4.1s" repeatCount="indefinite" begin="-1.2s"
        path="M 420,120 C 420,80 470,70 490,95 C 510,120 510,150 490,170 C 470,190 420,180 420,150 C 420,135 420,125 420,120 Z"/>
    </circle>

    <circle r="2.4" fill="#5cff8a">
      <animateMotion dur="3.6s" repeatCount="indefinite" begin="-0.6s"
        path="M 300,250 C 290,220 320,200 350,215 C 380,230 380,270 350,285 C 320,300 300,280 300,250 Z"/>
    </circle>

    <circle r="2" fill="#e6ffe6" opacity="0.8">
      <animateMotion dur="7s" repeatCount="indefinite" begin="-2s"
        path="M 40,60 C 200,20 550,20 720,80 C 700,160 700,260 600,300 C 400,330 150,300 60,240 C 20,190 20,110 40,60 Z"/>
    </circle>
  </g>

  <!-- collected core burst that loops -->
  <g filter="url(#glow)">
    <circle cx="150" cy="150" r="0" fill="#ffffff" opacity="0">
      <animate attributeName="r" values="0;22;0" dur="5.5s" repeatCount="indefinite" begin="0s"/>
      <animate attributeName="opacity" values="0;0.9;0" dur="5.5s" repeatCount="indefinite" begin="0s"/>
    </circle>
    <text x="150" y="145" text-anchor="middle" font-family="Consolas, monospace" font-size="10" fill="#00ff41" opacity="0">
      +100
      <animate attributeName="opacity" values="0;0;1;0" dur="5.5s" repeatCount="indefinite"/>
      <animate attributeName="y" values="150;150;130;120" dur="5.5s" repeatCount="indefinite"/>
    </text>
  </g>

  <!-- scanline sweep -->
  <rect x="0" y="0" width="760" height="60" fill="url(#scan)">
    <animate attributeName="y" values="-60;340" dur="4s" repeatCount="indefinite"/>
  </rect>

  <!-- HUD readout, cycling numbers to look "live" -->
  <text x="16" y="322" font-family="Consolas, Menlo, monospace" font-size="11" fill="#00ff41" opacity="0.75">
    cores: <tspan fill="#ffffff">04</tspan>&#160;&#160;wells: <tspan fill="#ffffff">03</tspan>&#160;&#160;t+<tspan fill="#ffffff">00:42</tspan>&#160;&#160;status: <tspan fill="#39ff6a">STABLE</tspan>
  </text>
  <rect x="640" y="308" width="6" height="12" fill="#00ff41">
    <animate attributeName="opacity" values="1;0;1" dur="1s" repeatCount="indefinite"/>
  </rect>

  <line x1="0" y1="28" x2="760" y2="28" stroke="#00ff41" stroke-opacity="0.15"/>
</svg>

<svg width="1200" height="260" viewBox="0 0 1200 260" xmlns="http://www.w3.org/2000/svg" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="flow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#7b2ff7">
        <animate attributeName="stop-color"
          values="#7b2ff7;#00c6ff;#ff2b6f;#ffb347;#00e5c8;#7b2ff7"
          dur="10s" repeatCount="indefinite"/>
      </stop>
      <stop offset="50%" stop-color="#00c6ff">
        <animate attributeName="stop-color"
          values="#00c6ff;#ff2b6f;#ffb347;#00e5c8;#7b2ff7;#00c6ff"
          dur="10s" repeatCount="indefinite"/>
      </stop>
      <stop offset="100%" stop-color="#ff2b6f">
        <animate attributeName="stop-color"
          values="#ff2b6f;#ffb347;#00e5c8;#7b2ff7;#00c6ff;#ff2b6f"
          dur="10s" repeatCount="indefinite"/>
      </stop>
    </linearGradient>

    <linearGradient id="waveShade" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#000000" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0.15"/>
    </linearGradient>

    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <clipPath id="roundedFrame">
      <rect x="0" y="0" width="1200" height="260" rx="14"/>
    </clipPath>
  </defs>

  <g clip-path="url(#roundedFrame)">
    <rect width="1200" height="260" fill="url(#flow)"/>

    <!-- bottom wave silhouette, same style as a capsule-render waving footer -->
    <path d="M0,220 C 200,260 350,190 600,215 C 850,240 1000,180 1200,210 L1200,260 L0,260 Z" fill="url(#waveShade)"/>

    <!-- title -->
    <text x="600" y="110" text-anchor="middle" font-family="Verdana, Geneva, sans-serif"
          font-size="64" font-weight="bold" fill="#ffffff" filter="url(#glow)">
      MOHAK MITTAL
      <animate attributeName="opacity" values="0.85;1;0.85" dur="4s" repeatCount="indefinite"/>
    </text>

    <!-- tagline -->
    <text x="600" y="160" text-anchor="middle" font-family="Verdana, Geneva, sans-serif"
          font-size="22" font-weight="600" fill="#eaf6ff" opacity="0.95">
      Unreal Engine Developer · C++ Enthusiast · Game Dev
    </text>
  </g>
</svg>

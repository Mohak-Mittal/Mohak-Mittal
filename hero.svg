<svg width="1200" height="420" viewBox="0 0 1200 420" xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#05050f"/>
      <stop offset="55%" stop-color="#0b0b1e"/>
      <stop offset="100%" stop-color="#120a1f"/>
    </linearGradient>
    <linearGradient id="road" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1a1622"/>
      <stop offset="100%" stop-color="#050307"/>
    </linearGradient>
    <linearGradient id="glowBar" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#7b2ff7" stop-opacity="0"/>
      <stop offset="50%" stop-color="#00e5ff" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#7b2ff7" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="moonGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#7ef9ff" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#7ef9ff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="carBody" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#3a3a46"/>
      <stop offset="45%" stop-color="#131318"/>
      <stop offset="100%" stop-color="#050507"/>
    </linearGradient>
    <radialGradient id="tailGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ff2b4d" stop-opacity="1"/>
      <stop offset="100%" stop-color="#ff2b4d" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="earthGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0d47a1"/>
      <stop offset="55%" stop-color="#00e5ff"/>
      <stop offset="100%" stop-color="#0d1b3a"/>
    </linearGradient>
    <clipPath id="frame"><rect x="0" y="0" width="1200" height="420" rx="18"/></clipPath>
    <clipPath id="earthClip"><circle cx="0" cy="0" r="34"/></clipPath>
  </defs>

  <g clip-path="url(#frame)">
    <rect width="1200" height="420" fill="url(#sky)"/>

    <!-- distant glowing moon/badge -->
    <circle cx="600" cy="90" r="70" fill="url(#moonGlow)"/>

    <!-- parallax city skyline, looped scroll -->
    <g id="cityFar" opacity="0.55">
      <g id="cityFarInner">
        <use xlink:href="#buildingsFar" x="0"/>
        <use xlink:href="#buildingsFar" x="1200"/>
      </g>
      <animateTransform attributeName="transform" type="translate" from="0 0" to="-1200 0" dur="22s" repeatCount="indefinite"/>
    </g>
    <g id="cityNear" opacity="0.85">
      <g id="cityNearInner">
        <use xlink:href="#buildingsNear" x="0"/>
        <use xlink:href="#buildingsNear" x="1200"/>
      </g>
      <animateTransform attributeName="transform" type="translate" from="0 0" to="-1200 0" dur="11s" repeatCount="indefinite"/>
    </g>

    <defs>
      <g id="buildingsFar" fill="#1c1436">
        <rect x="40" y="150" width="60" height="140"/>
        <rect x="120" y="120" width="45" height="170"/>
        <rect x="200" y="165" width="70" height="125"/>
        <rect x="300" y="100" width="50" height="190"/>
        <rect x="380" y="140" width="65" height="150"/>
        <rect x="470" y="115" width="55" height="175"/>
        <rect x="560" y="160" width="70" height="130"/>
        <rect x="660" y="130" width="50" height="160"/>
        <rect x="740" y="150" width="65" height="140"/>
        <rect x="830" y="110" width="55" height="180"/>
        <rect x="920" y="155" width="70" height="135"/>
        <rect x="1010" y="125" width="50" height="165"/>
        <rect x="1090" y="145" width="65" height="145"/>
      </g>
      <g id="buildingsNear" fill="#0a0616">
        <rect x="10" y="200" width="80" height="120" fill="#0a0616"/>
        <rect x="20" y="210" width="6" height="100" fill="#ff2b6f" opacity="0.5"/>
        <rect x="120" y="230" width="55" height="90"/>
        <rect x="220" y="190" width="90" height="130"/>
        <rect x="235" y="200" width="6" height="110" fill="#00e5ff" opacity="0.5"/>
        <rect x="350" y="215" width="60" height="105"/>
        <rect x="450" y="180" width="100" height="140"/>
        <rect x="470" y="190" width="6" height="120" fill="#7b2ff7" opacity="0.6"/>
        <rect x="590" y="225" width="55" height="95"/>
        <rect x="680" y="195" width="85" height="125"/>
        <rect x="800" y="210" width="65" height="110"/>
        <rect x="900" y="185" width="95" height="135"/>
        <rect x="920" y="195" width="6" height="115" fill="#00e5ff" opacity="0.5"/>
        <rect x="1030" y="220" width="60" height="100"/>
        <rect x="1120" y="200" width="70" height="120"/>
      </g>
    </defs>

    <!-- road -->
    <rect x="0" y="300" width="1200" height="120" fill="url(#road)"/>
    <rect x="0" y="298" width="1200" height="4" fill="url(#glowBar)"/>

    <!-- scrolling lane dashes, perfect loop -->
    <g id="lanes" fill="#00e5ff">
      <g id="lanesInner">
        <use xlink:href="#dashSet" x="0"/>
        <use xlink:href="#dashSet" x="240"/>
      </g>
      <animateTransform attributeName="transform" type="translate" from="0 0" to="-240 0" dur="1.1s" repeatCount="indefinite"/>
    </g>
    <defs>
      <g id="dashSet" opacity="0.85">
        <rect x="0" y="356" width="70" height="8" rx="4"/>
        <rect x="120" y="356" width="70" height="8" rx="4"/>
      </g>
    </defs>

    <!-- car, stays centered, gentle bob -->
    <g transform="translate(600,318)">
      <ellipse cx="0" cy="58" rx="118" ry="14" fill="#000" opacity="0.55"/>
      <g id="carBob">
        <!-- taillight glow -->
        <circle cx="-70" cy="18" r="22" fill="url(#tailGlow)">
          <animate attributeName="opacity" values="0.5;1;0.5" dur="1.4s" repeatCount="indefinite"/>
        </circle>
        <circle cx="70" cy="18" r="22" fill="url(#tailGlow)">
          <animate attributeName="opacity" values="0.5;1;0.5" dur="1.4s" repeatCount="indefinite"/>
        </circle>
        <!-- body (rear 3/4 stylized) -->
        <path d="M -115,40 L -95,-5 Q -70,-30 0,-32 Q 70,-30 95,-5 L 115,40 Q 90,52 0,52 Q -90,52 -115,40 Z" fill="url(#carBody)" stroke="#4a4a56" stroke-width="1.5"/>
        <path d="M -55,-24 Q 0,-40 55,-24 L 45,-2 Q 0,-14 -45,-2 Z" fill="#0b0e14" stroke="#2f7ea8" stroke-width="1.2" opacity="0.9"/>
        <rect x="-92" y="10" width="34" height="10" rx="4" fill="#ff2b4d"/>
        <rect x="58" y="10" width="34" height="10" rx="4" fill="#ff2b4d"/>
        <rect x="-16" y="14" width="32" height="7" rx="3" fill="#ffffff" opacity="0.8"/>
        <circle cx="-70" cy="46" r="16" fill="#050505" stroke="#3a3a3a" stroke-width="3"/>
        <circle cx="70" cy="46" r="16" fill="#050505" stroke="#3a3a3a" stroke-width="3"/>
        <animateTransform attributeName="transform" type="translate" values="0 0; 0 -3; 0 0" dur="1.2s" repeatCount="indefinite"/>
      </g>
    </g>

    <!-- rotating emblem badge, perfect loop -->
    <g transform="translate(600,84)">
      <circle r="34" fill="#050505" stroke="#00e5ff" stroke-width="2" opacity="0.9"/>
      <g>
        <path d="M -14,-16 L -14,6 Q -14,16 0,16 Q 14,16 14,6 L 14,-16" fill="none" stroke="#eaeaea" stroke-width="4" stroke-linecap="round"/>
        <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="6s" repeatCount="indefinite"/>
      </g>
    </g>

    <!-- rotating earth, bottom right, perfect loop -->
    <g transform="translate(1120,360)">
      <circle r="36" fill="url(#earthGrad)"/>
      <g clip-path="url(#earthClip)">
        <g>
          <ellipse cx="0" cy="-10" rx="14" ry="7" fill="#0d1b3a" opacity="0.7"/>
          <ellipse cx="20" cy="5" rx="10" ry="6" fill="#0d1b3a" opacity="0.7"/>
          <ellipse cx="-18" cy="12" rx="12" ry="6" fill="#0d1b3a" opacity="0.7"/>
          <ellipse cx="-4" cy="-22" rx="10" ry="5" fill="#0d1b3a" opacity="0.6"/>
          <animateTransform attributeName="transform" type="translate" from="-70 0" to="70 0" dur="5s" repeatCount="indefinite"/>
        </g>
      </g>
      <circle r="36" fill="none" stroke="#7ef9ff" stroke-width="1.5" opacity="0.6"/>
    </g>

    <!-- text block -->
    <g font-family="Verdana, Geneva, sans-serif">
      <text x="60" y="70" fill="#8f8fa3" font-size="16" letter-spacing="2">HEY, I'M</text>
      <text x="58" y="120" fill="#f3f3f7" font-size="54" font-weight="bold">MOHAK</text>
      <text x="58" y="172" fill="#00e5ff" font-size="54" font-weight="bold">MITTAL</text>
      <text x="60" y="205" fill="#b9b9c9" font-size="16">Unreal Engine Developer · C++ Enthusiast · Builder</text>
    </g>

    <!-- status strip -->
    <g font-family="Verdana, Geneva, sans-serif">
      <circle cx="62" cy="384" r="5" fill="#39ff8f">
        <animate attributeName="opacity" values="1;0.3;1" dur="1.6s" repeatCount="indefinite"/>
      </circle>
      <text x="75" y="389" fill="#8f8fa3" font-size="14">Now building something cool · Always learning</text>
    </g>
  </g>
  <rect x="1" y="1" width="1198" height="418" rx="18" fill="none" stroke="#22223a" stroke-width="2"/>
</svg>

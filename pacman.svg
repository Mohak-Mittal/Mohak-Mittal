<svg width="760" height="160" viewBox="0 0 760 160" xmlns="http://www.w3.org/2000/svg" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <filter id="pacGlow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="2.5" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect width="760" height="160" fill="#010104"/>

  <!-- maze-style border dots track -->
  <line x1="0" y1="80" x2="760" y2="80" stroke="#1a1a2e" stroke-width="18"/>

  <!-- dots along the track, each vanishes right before pac-man's mouth reaches it -->
  <g fill="#ffd23f">
    <!-- generate a row of dots every 26px; each gets an opacity animation offset by its position -->
    <circle cx="40" cy="80" r="3"><animate attributeName="opacity" values="1;1;0;0;0;1" keyTimes="0;0.049;0.05;0.9;0.99;1" dur="6s" repeatCount="indefinite"/></circle>
    <circle cx="66" cy="80" r="3"><animate attributeName="opacity" values="1;1;0;0;0;1" keyTimes="0;0.084;0.085;0.9;0.99;1" dur="6s" repeatCount="indefinite"/></circle>
    <circle cx="92" cy="80" r="3"><animate attributeName="opacity" values="1;1;0;0;0;1" keyTimes="0;0.119;0.12;0.9;0.99;1" dur="6s" repeatCount="indefinite"/></circle>
    <circle cx="118" cy="80" r="3"><animate attributeName="opacity" values="1;1;0;0;0;1" keyTimes="0;0.154;0.155;0.9;0.99;1" dur="6s" repeatCount="indefinite"/></circle>
    <circle cx="144" cy="80" r="3"><animate attributeName="opacity" values="1;1;0;0;0;1" keyTimes="0;0.189;0.19;0.9;0.99;1" dur="6s" repeatCount="indefinite"/></circle>
    <circle cx="170" cy="80" r="3"><animate attributeName="opacity" values="1;1;0;0;0;1" keyTimes="0;0.224;0.225;0.9;0.99;1" dur="6s" repeatCount="indefinite"/></circle>
    <circle cx="196" cy="80" r="3"><animate attributeName="opacity" values="1;1;0;0;0;1" keyTimes="0;0.259;0.26;0.9;0.99;1" dur="6s" repeatCount="indefinite"/></circle>
    <circle cx="222" cy="80" r="3"><animate attributeName="opacity" values="1;1;0;0;0;1" keyTimes="0;0.294;0.295;0.9;0.99;1" dur="6s" repeatCount="indefinite"/></circle>
    <circle cx="248" cy="80" r="3"><animate attributeName="opacity" values="1;1;0;0;0;1" keyTimes="0;0.329;0.33;0.9;0.99;1" dur="6s" repeatCount="indefinite"/></circle>
    <circle cx="274" cy="80" r="3"><animate attributeName="opacity" values="1;1;0;0;0;1" keyTimes="0;0.364;0.365;0.9;0.99;1" dur="6s" repeatCount="indefinite"/></circle>
    <circle cx="300" cy="80" r="3"><animate attributeName="opacity" values="1;1;0;0;0;1" keyTimes="0;0.399;0.4;0.9;0.99;1" dur="6s" repeatCount="indefinite"/></circle>
    <circle cx="326" cy="80" r="3"><animate attributeName="opacity" values="1;1;0;0;0;1" keyTimes="0;0.434;0.435;0.9;0.99;1" dur="6s" repeatCount="indefinite"/></circle>
    <circle cx="352" cy="80" r="3"><animate attributeName="opacity" values="1;1;0;0;0;1" keyTimes="0;0.469;0.47;0.9;0.99;1" dur="6s" repeatCount="indefinite"/></circle>
    <circle cx="378" cy="80" r="3"><animate attributeName="opacity" values="1;1;0;0;0;1" keyTimes="0;0.504;0.505;0.9;0.99;1" dur="6s" repeatCount="indefinite"/></circle>
    <circle cx="404" cy="80" r="3"><animate attributeName="opacity" values="1;1;0;0;0;1" keyTimes="0;0.539;0.54;0.9;0.99;1" dur="6s" repeatCount="indefinite"/></circle>
    <circle cx="430" cy="80" r="3"><animate attributeName="opacity" values="1;1;0;0;0;1" keyTimes="0;0.574;0.575;0.9;0.99;1" dur="6s" repeatCount="indefinite"/></circle>
    <circle cx="456" cy="80" r="3"><animate attributeName="opacity" values="1;1;0;0;0;1" keyTimes="0;0.609;0.61;0.9;0.99;1" dur="6s" repeatCount="indefinite"/></circle>
    <circle cx="482" cy="80" r="3"><animate attributeName="opacity" values="1;1;0;0;0;1" keyTimes="0;0.644;0.645;0.9;0.99;1" dur="6s" repeatCount="indefinite"/></circle>
    <circle cx="508" cy="80" r="3"><animate attributeName="opacity" values="1;1;0;0;0;1" keyTimes="0;0.679;0.68;0.9;0.99;1" dur="6s" repeatCount="indefinite"/></circle>
    <circle cx="534" cy="80" r="3"><animate attributeName="opacity" values="1;1;0;0;0;1" keyTimes="0;0.714;0.715;0.9;0.99;1" dur="6s" repeatCount="indefinite"/></circle>
    <circle cx="560" cy="80" r="3"><animate attributeName="opacity" values="1;1;0;0;0;1" keyTimes="0;0.749;0.75;0.9;0.99;1" dur="6s" repeatCount="indefinite"/></circle>
    <circle cx="586" cy="80" r="3"><animate attributeName="opacity" values="1;1;0;0;0;1" keyTimes="0;0.784;0.785;0.9;0.99;1" dur="6s" repeatCount="indefinite"/></circle>
    <circle cx="612" cy="80" r="3"><animate attributeName="opacity" values="1;1;0;0;0;1" keyTimes="0;0.819;0.82;0.9;0.99;1" dur="6s" repeatCount="indefinite"/></circle>
    <circle cx="638" cy="80" r="3"><animate attributeName="opacity" values="1;1;0;0;0;1" keyTimes="0;0.854;0.855;0.9;0.99;1" dur="6s" repeatCount="indefinite"/></circle>
    <circle cx="664" cy="80" r="3"><animate attributeName="opacity" values="1;1;0;0;0;1" keyTimes="0;0.889;0.89;0.9;0.99;1" dur="6s" repeatCount="indefinite"/></circle>
    <circle cx="690" cy="80" r="6" fill="#ffffff"><animate attributeName="opacity" values="0.4;1;0.4" dur="0.5s" repeatCount="indefinite"/></circle>
  </g>

  <!-- pac-man: two wedge halves that open/close to fake chomping, moving left to right on a loop -->
  <g filter="url(#pacGlow)">
    <g>
      <animateTransform attributeName="transform" type="translate" values="0,0; 700,0; 0,0" keyTimes="0;0.9;1" dur="6s" repeatCount="indefinite"/>

      <path fill="#ffd23f">
        <animate attributeName="d" dur="0.35s" repeatCount="indefinite"
          values="
            M 30,80 L 60,60 A 30,30 0 1 1 60,100 Z;
            M 30,80 L 58,72 A 30,30 0 1 1 58,88 Z;
            M 30,80 A 30,30 0 1 1 30,80 Z;
            M 30,80 L 58,72 A 30,30 0 1 1 58,88 Z;
            M 30,80 L 60,60 A 30,30 0 1 1 60,100 Z
          "/>
      </path>
    </g>
  </g>

  <!-- ghosts trailing behind, bobbing -->
  <g>
    <animateTransform attributeName="transform" type="translate" values="-40,0; 660,0; -40,0" keyTimes="0;0.9;1" dur="6s" repeatCount="indefinite"/>
    <g>
      <animateTransform attributeName="transform" type="translate" values="0,0; 0,-4; 0,0" dur="0.4s" repeatCount="indefinite" additive="sum"/>
      <path d="M 0,80 a 16,16 0 1 1 32,0 v 16 l -4,-6 -4,6 -4,-6 -4,6 -4,-6 -4,6 -4,-6 -4,6 Z" fill="#ff3b3b"/>
      <circle cx="10" cy="76" r="4" fill="#fff"/><circle cx="22" cy="76" r="4" fill="#fff"/>
      <circle cx="11" cy="76" r="2" fill="#0033ff"/><circle cx="23" cy="76" r="2" fill="#0033ff"/>
    </g>
  </g>
  <g>
    <animateTransform attributeName="transform" type="translate" values="-80,0; 620,0; -80,0" keyTimes="0;0.9;1" dur="6s" repeatCount="indefinite"/>
    <g>
      <animateTransform attributeName="transform" type="translate" values="0,0; 0,-4; 0,0" dur="0.45s" repeatCount="indefinite" additive="sum"/>
      <path d="M 0,80 a 16,16 0 1 1 32,0 v 16 l -4,-6 -4,6 -4,-6 -4,6 -4,-6 -4,6 -4,-6 -4,6 Z" fill="#00d1ff"/>
      <circle cx="10" cy="76" r="4" fill="#fff"/><circle cx="22" cy="76" r="4" fill="#fff"/>
      <circle cx="11" cy="76" r="2" fill="#0033ff"/><circle cx="23" cy="76" r="2" fill="#0033ff"/>
    </g>
  </g>
  <g>
    <animateTransform attributeName="transform" type="translate" values="-120,0; 580,0; -120,0" keyTimes="0;0.9;1" dur="6s" repeatCount="indefinite"/>
    <g>
      <animateTransform attributeName="transform" type="translate" values="0,0; 0,-4; 0,0" dur="0.5s" repeatCount="indefinite" additive="sum"/>
      <path d="M 0,80 a 16,16 0 1 1 32,0 v 16 l -4,-6 -4,6 -4,-6 -4,6 -4,-6 -4,6 -4,-6 -4,6 Z" fill="#ffb8ff"/>
      <circle cx="10" cy="76" r="4" fill="#fff"/><circle cx="22" cy="76" r="4" fill="#fff"/>
      <circle cx="11" cy="76" r="2" fill="#0033ff"/><circle cx="23" cy="76" r="2" fill="#0033ff"/>
    </g>
  </g>

  <text x="380" y="140" text-anchor="middle" font-family="'Press Start 2P', monospace" font-size="11" fill="#ffd23f" opacity="0.85">WAKA WAKA WAKA</text>
</svg>

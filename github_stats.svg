<svg width="900" height="320" viewBox="0 0 900 320" xmlns="http://www.w3.org/2000/svg" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="cyberBg5" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#7b2ff7">
        <animate attributeName="stop-color" values="#7b2ff7;#00c6ff;#ff2b6f;#ffb347;#00e5c8;#7b2ff7" dur="10s" repeatCount="indefinite"/>
      </stop>
      <stop offset="50%" stop-color="#00c6ff">
        <animate attributeName="stop-color" values="#00c6ff;#ff2b6f;#ffb347;#00e5c8;#7b2ff7;#00c6ff" dur="10s" repeatCount="indefinite"/>
      </stop>
      <stop offset="100%" stop-color="#ff2b6f">
        <animate attributeName="stop-color" values="#ff2b6f;#ffb347;#00e5c8;#7b2ff7;#00c6ff;#ff2b6f" dur="10s" repeatCount="indefinite"/>
      </stop>
    </linearGradient>
    <pattern id="grid5" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#a855f7" stroke-width="0.5" opacity="0.18"/>
    </pattern>
    <clipPath id="roundedFrame5">
      <rect x="0" y="0" width="900" height="320" rx="22"/>
    </clipPath>
    <filter id="glow5" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="4" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <g clip-path="url(#roundedFrame5)">
    <rect width="900" height="320" fill="url(#cyberBg5)"/>
    <rect width="900" height="320" fill="url(#grid5)"/>

    <g stroke="#ffffff" stroke-width="2" opacity="0.6" fill="none">
      <path d="M 20,50 L 20,20 L 50,20"/>
      <path d="M 850,20 L 880,20 L 880,50"/>
      <path d="M 880,270 L 880,300 L 850,300"/>
      <path d="M 50,300 L 20,300 L 20,270"/>
    </g>

    <g font-family="Consolas, 'Courier New', monospace" text-anchor="middle" fill="#ffffff">
      <text x="450" y="50" font-size="28" font-weight="bold" filter="url(#glow5)">📊 GITHUB STATS</text>
    </g>

    <!-- divider lines -->
    <line x1="330" y1="90" x2="330" y2="260" stroke="#ffffff" stroke-width="1" opacity="0.3"/>
    <line x1="570" y1="90" x2="570" y2="260" stroke="#ffffff" stroke-width="1" opacity="0.3"/>

    <g font-family="Consolas, monospace" text-anchor="middle" fill="#ffffff">

      <!-- Total Contributions -->
      <g transform="translate(165,150)">
        <g><animateTransform attributeName="transform" type="translate" values="0,0;0,-6;0,0" dur="3s" begin="0s" repeatCount="indefinite"/>
          <text y="0" font-size="46" font-weight="bold" fill="#ff2b6f" filter="url(#glow5)">168</text>
        </g>
        <text y="34" font-size="14" font-weight="bold" fill="#ff2b6f">Total Contributions</text>
        <text y="56" font-size="12" fill="#e8e8f5" opacity="0.85">Jan 23 - Present</text>
      </g>

      <!-- Current Streak -->
      <g transform="translate(450,140)">
        <g><animateTransform attributeName="transform" type="translate" values="0,0;0,-6;0,0" dur="3s" begin="0.3s" repeatCount="indefinite"/>
          <circle r="42" fill="none" stroke="#00c6ff" stroke-width="4" filter="url(#glow5)"/>
          <text y="-22" font-size="20">🔥
            <animate attributeName="opacity" values="1;0.5;1" dur="1s" repeatCount="indefinite"/>
          </text>
          <text y="10" font-size="26" font-weight="bold" fill="#ffd166">2</text>
        </g>
        <text y="76" font-size="14" font-weight="bold" fill="#ffffff" filter="url(#glow5)">Current Streak</text>
        <text y="98" font-size="12" fill="#e8e8f5" opacity="0.85">Sep 5 - Sep 6</text>
      </g>

      <!-- Longest Streak -->
      <g transform="translate(735,150)">
        <g><animateTransform attributeName="transform" type="translate" values="0,0;0,-6;0,0" dur="3s" begin="0.6s" repeatCount="indefinite"/>
          <text y="0" font-size="46" font-weight="bold" fill="#ff2b6f" filter="url(#glow5)">5</text>
        </g>
        <text y="34" font-size="14" font-weight="bold" fill="#ff2b6f">Longest Streak</text>
        <text y="56" font-size="12" fill="#e8e8f5" opacity="0.85">Mar 27 - Mar 31</text>
      </g>
    </g>
  </g>
</svg>

<svg width="1200" height="180" viewBox="0 0 1200 180" xmlns="http://www.w3.org/2000/svg" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="cpp" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#5C9FE0"/><stop offset="100%" stop-color="#004482"/></linearGradient>
    <linearGradient id="py" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#FFE873"/><stop offset="100%" stop-color="#4B8BBE"/></linearGradient>
    <linearGradient id="ue" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#3a3a3a"/><stop offset="100%" stop-color="#0a0a0a"/></linearGradient>
    <linearGradient id="blender" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#FFA95F"/><stop offset="100%" stop-color="#EA7600"/></linearGradient>
    <linearGradient id="vs" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#B084F5"/><stop offset="100%" stop-color="#5C2D91"/></linearGradient>
    <linearGradient id="git" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#6e6e6e"/><stop offset="100%" stop-color="#111"/></linearGradient>
    <linearGradient id="vscode" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#6FC3F7"/><stop offset="100%" stop-color="#0B5FA5"/></linearGradient>
    <linearGradient id="html" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#FF6F4D"/><stop offset="100%" stop-color="#C7331F"/></linearGradient>
    <linearGradient id="java" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#F58A3C"/><stop offset="100%" stop-color="#9E3F1E"/></linearGradient>
    <linearGradient id="win" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#5FC3FF"/><stop offset="100%" stop-color="#0072C6"/></linearGradient>
    <filter id="softShadow" x="-50%" y="-50%" width="200%" height="200%">
      <feDropShadow dx="0" dy="6" stdDeviation="5" flood-color="#000" flood-opacity="0.45"/>
    </filter>
  </defs>

  <g font-family="Verdana, Geneva, sans-serif" font-size="13" fill="#b9b9c9" text-anchor="middle">
    <!-- Each icon: hexagon puck (pseudo-3D via gradient+shadow) with independent float loop -->

    <g transform="translate(70,80)">
      <g filter="url(#softShadow)">
        <polygon points="0,-38 33,-19 33,19 0,38 -33,19 -33,-19" fill="url(#cpp)"/>
        <text x="0" y="10" font-size="26" font-weight="bold" fill="#fff" text-anchor="middle">C++</text>
      </g>
      <text y="66">C++</text>
      <animateTransform attributeName="transform" type="translate" additive="sum" values="0,0;0,-10;0,0" dur="2.6s" begin="0s" repeatCount="indefinite"/>
    </g>

    <g transform="translate(190,80)">
      <g filter="url(#softShadow)">
        <polygon points="0,-38 33,-19 33,19 0,38 -33,19 -33,-19" fill="url(#py)"/>
        <text x="0" y="9" font-size="22" font-weight="bold" fill="#20304a" text-anchor="middle">Py</text>
      </g>
      <text y="66">Python</text>
      <animateTransform attributeName="transform" type="translate" additive="sum" values="0,0;0,-10;0,0" dur="2.6s" begin="0.3s" repeatCount="indefinite"/>
    </g>

    <g transform="translate(310,80)">
      <g filter="url(#softShadow)">
        <polygon points="0,-38 33,-19 33,19 0,38 -33,19 -33,-19" fill="url(#ue)" stroke="#555" stroke-width="1"/>
        <text x="0" y="10" font-size="24" font-weight="bold" fill="#fff" text-anchor="middle">U</text>
      </g>
      <text y="66">Unreal</text>
      <animateTransform attributeName="transform" type="translate" additive="sum" values="0,0;0,-10;0,0" dur="2.6s" begin="0.6s" repeatCount="indefinite"/>
    </g>

    <g transform="translate(430,80)">
      <g filter="url(#softShadow)">
        <polygon points="0,-38 33,-19 33,19 0,38 -33,19 -33,-19" fill="url(#blender)"/>
        <circle cx="0" cy="0" r="13" fill="none" stroke="#fff" stroke-width="4"/>
        <circle cx="0" cy="-10" r="5" fill="#fff"/>
      </g>
      <text y="66">Blender</text>
      <animateTransform attributeName="transform" type="translate" additive="sum" values="0,0;0,-10;0,0" dur="2.6s" begin="0.9s" repeatCount="indefinite"/>
    </g>

    <g transform="translate(550,80)">
      <g filter="url(#softShadow)">
        <polygon points="0,-38 33,-19 33,19 0,38 -33,19 -33,-19" fill="url(#vs)"/>
        <text x="0" y="9" font-size="20" font-weight="bold" fill="#fff" text-anchor="middle">VS</text>
      </g>
      <text y="66">Studio</text>
      <animateTransform attributeName="transform" type="translate" additive="sum" values="0,0;0,-10;0,0" dur="2.6s" begin="1.2s" repeatCount="indefinite"/>
    </g>

    <g transform="translate(670,80)">
      <g filter="url(#softShadow)">
        <polygon points="0,-38 33,-19 33,19 0,38 -33,19 -33,-19" fill="url(#git)"/>
        <circle cx="0" cy="0" r="14" fill="none" stroke="#fff" stroke-width="3"/>
        <circle cx="-5" cy="-5" r="2.5" fill="#fff"/>
        <circle cx="5" cy="5" r="2.5" fill="#fff"/>
      </g>
      <text y="66">Git/GitHub</text>
      <animateTransform attributeName="transform" type="translate" additive="sum" values="0,0;0,-10;0,0" dur="2.6s" begin="1.5s" repeatCount="indefinite"/>
    </g>

    <g transform="translate(790,80)">
      <g filter="url(#softShadow)">
        <polygon points="0,-38 33,-19 33,19 0,38 -33,19 -33,-19" fill="url(#vscode)"/>
        <text x="0" y="9" font-size="18" font-weight="bold" fill="#fff" text-anchor="middle">&lt;/&gt;</text>
      </g>
      <text y="66">VS Code</text>
      <animateTransform attributeName="transform" type="translate" additive="sum" values="0,0;0,-10;0,0" dur="2.6s" begin="1.8s" repeatCount="indefinite"/>
    </g>

    <g transform="translate(910,80)">
      <g filter="url(#softShadow)">
        <polygon points="0,-38 33,-19 33,19 0,38 -33,19 -33,-19" fill="url(#html)"/>
        <text x="0" y="9" font-size="20" font-weight="bold" fill="#fff" text-anchor="middle">5</text>
      </g>
      <text y="66">HTML5</text>
      <animateTransform attributeName="transform" type="translate" additive="sum" values="0,0;0,-10;0,0" dur="2.6s" begin="2.1s" repeatCount="indefinite"/>
    </g>

    <g transform="translate(1030,80)">
      <g filter="url(#softShadow)">
        <polygon points="0,-38 33,-19 33,19 0,38 -33,19 -33,-19" fill="url(#java)"/>
        <text x="0" y="9" font-size="20" font-weight="bold" fill="#fff" text-anchor="middle">J</text>
      </g>
      <text y="66">Java</text>
      <animateTransform attributeName="transform" type="translate" additive="sum" values="0,0;0,-10;0,0" dur="2.6s" begin="2.4s" repeatCount="indefinite"/>
    </g>

    <g transform="translate(1140,80)">
      <g filter="url(#softShadow)">
        <polygon points="0,-38 33,-19 33,19 0,38 -33,19 -33,-19" fill="url(#win)"/>
        <rect x="-13" y="-13" width="12" height="12" fill="#fff" opacity="0.9"/>
        <rect x="1" y="-13" width="12" height="12" fill="#fff" opacity="0.9"/>
        <rect x="-13" y="1" width="12" height="12" fill="#fff" opacity="0.9"/>
        <rect x="1" y="1" width="12" height="12" fill="#fff" opacity="0.9"/>
      </g>
      <text y="66">Windows</text>
      <animateTransform attributeName="transform" type="translate" additive="sum" values="0,0;0,-10;0,0" dur="2.6s" begin="2.7s" repeatCount="indefinite"/>
    </g>
  </g>
</svg>

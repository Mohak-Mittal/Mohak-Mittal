<svg width="900" height="170" viewBox="0 0 900 170" xmlns="http://www.w3.org/2000/svg" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <filter id="noise">
      <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="1" result="noise" seed="3"/>
      <feDisplacementMap in="SourceGraphic" in2="noise" scale="3"/>
    </filter>
  </defs>
  <rect width="900" height="170" fill="#050508"/>

  <g font-family="Consolas, 'Courier New', monospace" text-anchor="middle">

    <!-- LINE 1: name, glitch RGB split -->
    <g>
      <text x="452" y="58" font-size="42" font-weight="bold" fill="#ff2b6f" opacity="0.75">MOHAK MITTAL
        <animate attributeName="x" values="452;446;456;450;452" keyTimes="0;0.1;0.12;0.2;1" dur="3.2s" repeatCount="indefinite"/>
      </text>
      <text x="448" y="58" font-size="42" font-weight="bold" fill="#00e5ff" opacity="0.75">MOHAK MITTAL
        <animate attributeName="x" values="448;454;444;450;448" keyTimes="0;0.1;0.12;0.2;1" dur="3.2s" repeatCount="indefinite"/>
      </text>
      <text x="450" y="58" font-size="42" font-weight="bold" fill="#ffffff">MOHAK MITTAL
        <animate attributeName="opacity" values="1;1;0.3;1;1" keyTimes="0;0.55;0.57;0.59;1" dur="3.2s" repeatCount="indefinite"/>
      </text>
    </g>

    <!-- LINE 2 -->
    <text x="450" y="98" font-size="18" fill="#8fe3ff" opacity="0.9">// building worlds that don't exist yet
      <animate attributeName="opacity" values="0.9;0.9;0.2;0.9" keyTimes="0;0.7;0.72;1" dur="2.4s" repeatCount="indefinite"/>
    </text>

    <!-- LINE 3: status, blinking cursor -->
    <text x="450" y="132" font-size="16" fill="#c084fc" letter-spacing="2">
      STATUS: <tspan fill="#39ff8f">ONLINE</tspan><tspan fill="#39ff8f">_</tspan>
      <animate attributeName="opacity" values="1;1;0;0;1" dur="1.2s" repeatCount="indefinite"/>
    </text>
  </g>

  <!-- horizontal glitch scan bars, occasional flicker -->
  <rect x="0" y="40" width="900" height="4" fill="#ffffff" opacity="0">
    <animate attributeName="opacity" values="0;0;0.5;0;0;0;0.3;0" keyTimes="0;0.18;0.19;0.21;0.5;0.62;0.63;1" dur="3.2s" repeatCount="indefinite"/>
    <animate attributeName="y" values="20;70;110;30" dur="3.2s" repeatCount="indefinite"/>
  </rect>
</svg>

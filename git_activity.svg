<svg width="900" height="360" viewBox="0 0 900 360" xmlns="http://www.w3.org/2000/svg" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="cyberBg3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#7b2ff7">
        <animate attributeName="stop-color" values="#7b2ff7;#00c6ff;#ff2b6f;#ffb347;#00e5c8;#7b2ff7" dur="10s" repeatCount="indefinite"/>
      </stop>
      <stop offset="50%" stop-color="#00c6ff">
        <animate attributeName="stop-color" values="#00c6ff;#ff2b6f;#ffb347;#00e5c8;#7b2ff7;#00c6ff" dur="10s" repeatCount="indefinite"/>
      </stop>
      <stop offset="100%" stop-color="#ff2b6f">
        <animate attributeName="stop-color" values="#ff2b6f;#ffb347;#00e5c8;#7b2ff7;#00c6ff;#ff2b6f" dur="10s" repeatCount="indefinite"/>
      </stop>
    </linearGradient>

    <pattern id="grid3" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#a855f7" stroke-width="0.5" opacity="0.18"/>
    </pattern>

    <clipPath id="roundedFrame3">
      <rect x="0" y="0" width="900" height="360" rx="22"/>
    </clipPath>

    <filter id="glow3" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="4" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>

    <radialGradient id="chipPad" cx="50%" cy="35%" r="70%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.30"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.07"/>
    </radialGradient>
  </defs>

  <g clip-path="url(#roundedFrame3)">
    <rect width="900" height="360" fill="url(#cyberBg3)"/>
    <rect width="900" height="360" fill="url(#grid3)"/>

    <g stroke="#ffffff" stroke-width="2" opacity="0.6" fill="none">
      <path d="M 20,50 L 20,20 L 50,20"/>
      <path d="M 850,20 L 880,20 L 880,50"/>
      <path d="M 880,310 L 880,340 L 850,340"/>
      <path d="M 50,340 L 20,340 L 20,310"/>
    </g>

    <g font-family="Consolas, 'Courier New', monospace" text-anchor="middle" fill="#ffffff">
      <text x="450" y="48" font-size="28" font-weight="bold" filter="url(#glow3)">📊 GIT ACTIVITY</text>
      <text x="450" y="72" font-size="13" opacity="0.9" filter="url(#glow3)">Real commits, real repos — live numbers below in the stats section</text>
    </g>

    <!-- decorative mini contribution heatmap, purely illustrative -->
<g id="linechart">
        <line x1="100" y1="194.0" x2="780" y2="194.0" stroke="#ffffff" stroke-width="0.5" opacity="0.15"/>
<line x1="100" y1="168.0" x2="780" y2="168.0" stroke="#ffffff" stroke-width="0.5" opacity="0.15"/>
<line x1="100" y1="142.0" x2="780" y2="142.0" stroke="#ffffff" stroke-width="0.5" opacity="0.15"/>
<line x1="100" y1="116.0" x2="780" y2="116.0" stroke="#ffffff" stroke-width="0.5" opacity="0.15"/>
<line x1="100" y1="90.0" x2="780" y2="90.0" stroke="#ffffff" stroke-width="0.5" opacity="0.15"/>
        <line x1="100" y1="220" x2="780" y2="220" stroke="#ffffff" stroke-width="2" opacity="0.8"/>
        <line x1="100" y1="220" x2="100" y2="90" stroke="#ffffff" stroke-width="2" opacity="0.8"/>
        <text x="86" y="224.0" font-size="11" fill="#ffffff" text-anchor="end" opacity="0.85">0</text>
<text x="86" y="198.0" font-size="11" fill="#ffffff" text-anchor="end" opacity="0.85">2</text>
<text x="86" y="172.0" font-size="11" fill="#ffffff" text-anchor="end" opacity="0.85">4</text>
<text x="86" y="146.0" font-size="11" fill="#ffffff" text-anchor="end" opacity="0.85">6</text>
<text x="86" y="120.0" font-size="11" fill="#ffffff" text-anchor="end" opacity="0.85">8</text>
<text x="86" y="94.0" font-size="11" fill="#ffffff" text-anchor="end" opacity="0.85">10</text>
        <text x="100.0" y="240" font-size="11" fill="#ffffff" text-anchor="middle" opacity="0.85">Mon</text>
<text x="213.3" y="240" font-size="11" fill="#ffffff" text-anchor="middle" opacity="0.85">Tue</text>
<text x="326.7" y="240" font-size="11" fill="#ffffff" text-anchor="middle" opacity="0.85">Wed</text>

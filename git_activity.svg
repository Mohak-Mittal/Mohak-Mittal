<text x="666.7" y="240" font-size="11" fill="#ffffff" text-anchor="middle" opacity="0.85">Sat</text>
<text x="780.0" y="240" font-size="11" fill="#ffffff" text-anchor="middle" opacity="0.85">Sun</text>
        <text x="40" y="155.0" font-size="11" fill="#ffffff" text-anchor="middle" opacity="0.7" transform="rotate(-90 40 155.0)">Count</text>
        <g>
        <polyline points="100.0,181.0 213.3,142.0 326.7,194.0 440.0,116.0 553.3,155.0 666.7,103.0 780.0,142.0" fill="none" stroke="#ffffff" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round" filter="url(#glow3)" stroke-dasharray="747" stroke-dashoffset="747" opacity="0.95">
          <animate attributeName="stroke-dashoffset" values="747;0;0;747" keyTimes="0;0.5;0.9;1" dur="7s" begin="0.0s" repeatCount="indefinite"/>
        </polyline>
        <circle cx="100.0" cy="181.0" r="3.5" fill="#ffffff"/>
          <circle cx="213.3" cy="142.0" r="3.5" fill="#ffffff"/>
          <circle cx="326.7" cy="194.0" r="3.5" fill="#ffffff"/>
          <circle cx="440.0" cy="116.0" r="3.5" fill="#ffffff"/>
          <circle cx="553.3" cy="155.0" r="3.5" fill="#ffffff"/>
          <circle cx="666.7" cy="103.0" r="3.5" fill="#ffffff"/>
          <circle cx="780.0" cy="142.0" r="3.5" fill="#ffffff"/>
      </g><g>
        <polyline points="100.0,207.0 213.3,207.0 326.7,194.0 440.0,194.0 553.3,194.0 666.7,181.0 780.0,181.0" fill="none" stroke="#8fe3ff" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round" filter="url(#glow3)" stroke-dasharray="681" stroke-dashoffset="681" opacity="0.95">
          <animate attributeName="stroke-dashoffset" values="681;0;0;681" keyTimes="0;0.5;0.9;1" dur="7s" begin="0.3s" repeatCount="indefinite"/>
        </polyline>
        <circle cx="100.0" cy="207.0" r="3.5" fill="#8fe3ff"/>
          <circle cx="213.3" cy="207.0" r="3.5" fill="#8fe3ff"/>
          <circle cx="326.7" cy="194.0" r="3.5" fill="#8fe3ff"/>
          <circle cx="440.0" cy="194.0" r="3.5" fill="#8fe3ff"/>
          <circle cx="553.3" cy="194.0" r="3.5" fill="#8fe3ff"/>
          <circle cx="666.7" cy="181.0" r="3.5" fill="#8fe3ff"/>
          <circle cx="780.0" cy="181.0" r="3.5" fill="#8fe3ff"/>
      </g><g>
        <polyline points="100.0,220.0 213.3,207.0 326.7,207.0 440.0,194.0 553.3,181.0 666.7,181.0 780.0,168.0" fill="none" stroke="#ffd166" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round" filter="url(#glow3)" stroke-dasharray="683" stroke-dashoffset="683" opacity="0.95">
          <animate attributeName="stroke-dashoffset" values="683;0;0;683" keyTimes="0;0.5;0.9;1" dur="7s" begin="0.6s" repeatCount="indefinite"/>
        </polyline>
        <circle cx="100.0" cy="220.0" r="3.5" fill="#ffd166"/>
          <circle cx="213.3" cy="207.0" r="3.5" fill="#ffd166"/>
          <circle cx="326.7" cy="207.0" r="3.5" fill="#ffd166"/>
          <circle cx="440.0" cy="194.0" r="3.5" fill="#ffd166"/>
          <circle cx="553.3" cy="181.0" r="3.5" fill="#ffd166"/>
          <circle cx="666.7" cy="181.0" r="3.5" fill="#ffd166"/>
          <circle cx="780.0" cy="168.0" r="3.5" fill="#ffd166"/>
      </g><g>
        <polyline points="100.0,194.0 213.3,181.0 326.7,168.0 440.0,155.0 553.3,142.0 666.7,129.0 780.0,129.0" fill="none" stroke="#ff6fb0" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round" filter="url(#glow3)" stroke-dasharray="684" stroke-dashoffset="684" opacity="0.95">
          <animate attributeName="stroke-dashoffset" values="684;0;0;684" keyTimes="0;0.5;0.9;1" dur="7s" begin="0.8999999999999999s" repeatCount="indefinite"/>
        </polyline>
        <circle cx="100.0" cy="194.0" r="3.5" fill="#ff6fb0"/>
          <circle cx="213.3" cy="181.0" r="3.5" fill="#ff6fb0"/>
          <circle cx="326.7" cy="168.0" r="3.5" fill="#ff6fb0"/>
          <circle cx="440.0" cy="155.0" r="3.5" fill="#ff6fb0"/>
          <circle cx="553.3" cy="142.0" r="3.5" fill="#ff6fb0"/>
          <circle cx="666.7" cy="129.0" r="3.5" fill="#ff6fb0"/>
          <circle cx="780.0" cy="129.0" r="3.5" fill="#ff6fb0"/>
      </g>
        
      </g>

    <!-- 4 stat category chips, floating -->
    <g font-family="Consolas, monospace" text-anchor="middle" fill="#ffffff">

      <g transform="translate(180,290)">
        <g><animateTransform attributeName="transform" type="translate" values="0,0;0,-8;0,0" dur="2.6s" begin="0s" repeatCount="indefinite"/>
          <circle r="30" fill="url(#chipPad)" filter="url(#glow3)"/>
          <text y="7" font-size="22">📁</text>
        </g>
        <circle cx="-8" cy="48" r="4" fill="#8fe3ff"/><text x="7" y="52" font-size="14" font-weight="bold" text-anchor="start" filter="url(#glow3)">Repos</text>
      </g>

      <g transform="translate(360,290)">
        <g><animateTransform attributeName="transform" type="translate" values="0,0;0,-8;0,0" dur="2.6s" begin="0.4s" repeatCount="indefinite"/>
          <circle r="30" fill="url(#chipPad)" filter="url(#glow3)"/>
          <text y="7" font-size="22">💾</text>
        </g>
        <circle cx="-8" cy="48" r="4" fill="#ffffff"/><text x="7" y="52" font-size="14" font-weight="bold" text-anchor="start" filter="url(#glow3)">Commits</text>
      </g>

      <g transform="translate(540,290)">
        <g><animateTransform attributeName="transform" type="translate" values="0,0;0,-8;0,0" dur="2.6s" begin="0.8s" repeatCount="indefinite"/>
          <circle r="30" fill="url(#chipPad)" filter="url(#glow3)"/>
          <text y="7" font-size="22">⭐</text>
        </g>
        <circle cx="-8" cy="48" r="4" fill="#ffd166"/><text x="7" y="52" font-size="14" font-weight="bold" text-anchor="start" filter="url(#glow3)">Stars</text>
      </g>

      <g transform="translate(720,290)">
        <g><animateTransform attributeName="transform" type="translate" values="0,0;0,-8;0,0" dur="2.6s" begin="1.2s" repeatCount="indefinite"/>
          <circle r="30" fill="url(#chipPad)" filter="url(#glow3)"/>
          <text y="8" font-size="24">🔥
            <animate attributeName="opacity" values="1;0.6;1" dur="1.1s" repeatCount="indefinite"/>
          </text>
        </g>
        <circle cx="-8" cy="48" r="4" fill="#ff6fb0"/><text x="7" y="52" font-size="14" font-weight="bold" text-anchor="start" filter="url(#glow3)">Streak</text>
      </g>
    </g>

name: Update All Repository Languages

on:
  workflow_dispatch:
  schedule:
    - cron: "17 0 * * *"
  push:
    branches:
      - main
    paths-ignore:
      - "all_languages.svg"

permissions:
  contents: write

concurrency:
  group: all-languages
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout profile repository
        uses: actions/checkout@v6
        with:
          persist-credentials: true

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.x"

      - name: Check secret is present
        env:
          T: ${{ secrets.LANGUAGE_SCAN_TOKEN }}
        run: |
          if [ -z "$T" ]; then
            echo "::error::LANGUAGE_SCAN_TOKEN is EMPTY. Add it in THIS repo: Settings > Secrets and variables > Actions > Repository secrets."
            exit 1
          fi
          echo "Secret present, length ${#T}"

      - name: Generate language visualizer
        env:
          GITHUB_USERNAME: Mohak-Mittal
          LANGUAGE_SCAN_TOKEN: ${{ secrets.LANGUAGE_SCAN_TOKEN }}
        run: |
          python scripts/generate_all_languages.py
          test -s all_languages.svg
          echo "Generated all_languages.svg successfully."

      - name: Commit and push generated SVG
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f all_languages.svg
          if git diff --cached --quiet -- all_languages.svg; then
            echo "Language chart is already up to date."
            exit 0
          fi
          git commit -m "chore: update all repository languages"
          git pull --rebase origin main
          git push origin HEAD:main

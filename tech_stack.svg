<svg width="900" height="480" viewBox="0 0 900 480" xmlns="http://www.w3.org/2000/svg" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="cyberBg2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#7b2ff7">
        <animate attributeName="stop-color" values="#7b2ff7;#00c6ff;#ff2b6f;#ffb347;#00e5c8;#7b2ff7" dur="10s" repeatCount="indefinite"/>
      </stop>
      <stop offset="50%" stop-color="#00c6ff">
        <animate attributeName="stop-color" values="#00c6ff;#ff2b6f;#ffb347;#00e5c8;#7b2ff7;#00c6ff" dur="10s" repeatCount="indefinite"/>
      </stop>
      <stop offset="100%" stop-color="#ff2b6f">
        <animate attributeName="stop-color" values="#ff2b6f;#ffb347;#00e5c8;#7b2ff7;#00c6ff;#ff2b6f" dur="10s" repeatCount="indefinite"/>
      </stop>
    </linearGradient>

    <pattern id="grid2" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#a855f7" stroke-width="0.5" opacity="0.18"/>
    </pattern>

    <clipPath id="roundedFrame2">
      <rect x="0" y="0" width="900" height="480" rx="22"/>
    </clipPath>

    <filter id="glow2" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="5" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>

    <linearGradient id="cpp" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#5C9FE0"/><stop offset="100%" stop-color="#003f73"/></linearGradient>
    <linearGradient id="py" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#FFE873"/><stop offset="100%" stop-color="#4B8BBE"/></linearGradient>
    <linearGradient id="java" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#F58A3C"/><stop offset="100%" stop-color="#8a350f"/></linearGradient>
    <linearGradient id="ue" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#4a4a4a"/><stop offset="100%" stop-color="#050505"/></linearGradient>
    <linearGradient id="blender" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#FFA95F"/><stop offset="100%" stop-color="#c95d00"/></linearGradient>
    <linearGradient id="vs" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#B084F5"/><stop offset="100%" stop-color="#4b2179"/></linearGradient>
    <linearGradient id="vscode" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#6FC3F7"/><stop offset="100%" stop-color="#0a4a80"/></linearGradient>
    <linearGradient id="git" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#8a8a8a"/><stop offset="100%" stop-color="#0d0d0d"/></linearGradient>
    <linearGradient id="github" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#6e6e6e"/><stop offset="100%" stop-color="#000000"/></linearGradient>
    <linearGradient id="html" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#FF6F4D"/><stop offset="100%" stop-color="#8f1f10"/></linearGradient>
    <linearGradient id="win" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#5FC3FF"/><stop offset="100%" stop-color="#004c85"/></linearGradient>
  </defs>

  <g clip-path="url(#roundedFrame2)">
    <rect width="900" height="480" fill="url(#cyberBg2)"/>
    <rect width="900" height="480" fill="url(#grid2)"/>

    <g stroke="#ffffff" stroke-width="2" opacity="0.6" fill="none">
      <path d="M 20,50 L 20,20 L 50,20"/>
      <path d="M 850,20 L 880,20 L 880,50"/>
      <path d="M 880,430 L 880,460 L 850,460"/>
      <path d="M 50,460 L 20,460 L 20,430"/>
    </g>

    <g font-family="Consolas, 'Courier New', monospace" text-anchor="middle" fill="#ffffff">
      <text x="450" y="52" font-size="30" font-weight="bold" filter="url(#glow2)">🛠️ TECH STACK</text>
      <text x="450" y="78" font-size="14" opacity="0.9" filter="url(#glow2)">Languages, engines &amp; tools I use daily</text>
    </g>

    <!-- Row 1 -->
    <g font-family="Consolas, monospace" text-anchor="middle" fill="#ffffff">

      <g transform="translate(160,190)">
        <g><animateTransform attributeName="transform" type="translate" values="0,0;0,-10;0,0" dur="2.4s" begin="0s" repeatCount="indefinite"/>
          <polygon points="0,-34 30,-17 30,17 0,34 -30,17 -30,-17" fill="url(#cpp)" filter="url(#glow2)"/>
          <text y="7" font-size="18" font-weight="bold">C++</text>
        </g>
        <text y="58" font-size="13" filter="url(#glow2)">C++</text>
      </g>

      <g transform="translate(310,190)">
        <g><animateTransform attributeName="transform" type="translate" values="0,0;0,-10;0,0" dur="2.4s" begin="0.2s" repeatCount="indefinite"/>
          <polygon points="0,-34 30,-17 30,17 0,34 -30,17 -30,-17" fill="url(#py)" filter="url(#glow2)"/>
          <text y="6" font-size="16" font-weight="bold" fill="#1a2740">Py</text>
        </g>
        <text y="58" font-size="13" filter="url(#glow2)">Python</text>
      </g>

      <g transform="translate(460,190)">
        <g><animateTransform attributeName="transform" type="translate" values="0,0;0,-10;0,0" dur="2.4s" begin="0.4s" repeatCount="indefinite"/>
          <polygon points="0,-34 30,-17 30,17 0,34 -30,17 -30,-17" fill="url(#java)" filter="url(#glow2)"/>
          <text y="7" font-size="18" font-weight="bold">J</text>
        </g>
        <text y="58" font-size="13" filter="url(#glow2)">Java</text>
      </g>

      <g transform="translate(610,190)">
        <g><animateTransform attributeName="transform" type="translate" values="0,0;0,-10;0,0" dur="2.4s" begin="0.6s" repeatCount="indefinite"/>
          <polygon points="0,-34 30,-17 30,17 0,34 -30,17 -30,-17" fill="url(#ue)" stroke="#888" stroke-width="1" filter="url(#glow2)"/>
          <text y="7" font-size="18" font-weight="bold">U</text>
        </g>
        <text y="58" font-size="13" filter="url(#glow2)">Unreal</text>
      </g>

      <g transform="translate(760,190)">
        <g><animateTransform attributeName="transform" type="translate" values="0,0;0,-10;0,0" dur="2.4s" begin="0.8s" repeatCount="indefinite"/>
          <polygon points="0,-34 30,-17 30,17 0,34 -30,17 -30,-17" fill="url(#blender)" filter="url(#glow2)"/>
          <circle r="12" fill="none" stroke="#fff" stroke-width="3"/>
          <circle cy="-9" r="4.5" fill="#fff"/>
        </g>
        <text y="58" font-size="13" filter="url(#glow2)">Blender</text>
      </g>

      <!-- Row 2 -->
      <g transform="translate(160,340)">
        <g><animateTransform attributeName="transform" type="translate" values="0,0;0,-10;0,0" dur="2.4s" begin="1.0s" repeatCount="indefinite"/>
          <polygon points="0,-34 30,-17 30,17 0,34 -30,17 -30,-17" fill="url(#vs)" filter="url(#glow2)"/>
          <text y="6" font-size="16" font-weight="bold">VS</text>
        </g>
        <text y="58" font-size="13" filter="url(#glow2)">Studio</text>
      </g>

      <g transform="translate(310,340)">
        <g><animateTransform attributeName="transform" type="translate" values="0,0;0,-10;0,0" dur="2.4s" begin="1.2s" repeatCount="indefinite"/>
          <polygon points="0,-34 30,-17 30,17 0,34 -30,17 -30,-17" fill="url(#vscode)" filter="url(#glow2)"/>
          <text y="6" font-size="15" font-weight="bold">&lt;/&gt;</text>
        </g>
        <text y="58" font-size="13" filter="url(#glow2)">VS Code</text>
      </g>

      <g transform="translate(460,340)">
        <g><animateTransform attributeName="transform" type="translate" values="0,0;0,-10;0,0" dur="2.4s" begin="1.4s" repeatCount="indefinite"/>
          <polygon points="0,-34 30,-17 30,17 0,34 -30,17 -30,-17" fill="url(#git)" filter="url(#glow2)"/>
          <circle r="12" fill="none" stroke="#fff" stroke-width="2.5"/>
          <circle cx="-5" cy="-5" r="2.2" fill="#fff"/>
          <circle cx="5" cy="5" r="2.2" fill="#fff"/>
        </g>
        <text y="58" font-size="13" filter="url(#glow2)">Git</text>
      </g>

      <g transform="translate(610,340)">
        <g><animateTransform attributeName="transform" type="translate" values="0,0;0,-10;0,0" dur="2.4s" begin="1.6s" repeatCount="indefinite"/>
          <polygon points="0,-34 30,-17 30,17 0,34 -30,17 -30,-17" fill="url(#github)" filter="url(#glow2)"/>
          <text y="7" font-size="17" font-weight="bold">Git</text>
        </g>
        <text y="58" font-size="13" filter="url(#glow2)">GitHub</text>
      </g>

      <g transform="translate(760,340)">
        <g><animateTransform attributeName="transform" type="translate" values="0,0;0,-10;0,0" dur="2.4s" begin="1.8s" repeatCount="indefinite"/>
          <polygon points="0,-34 30,-17 30,17 0,34 -30,17 -30,-17" fill="url(#html)" filter="url(#glow2)"/>
          <text y="7" font-size="18" font-weight="bold">5</text>
        </g>
        <text y="58" font-size="13" filter="url(#glow2)">HTML5</text>
      </g>

      <g transform="translate(450,410)">
        <g><animateTransform attributeName="transform" type="translate" values="0,0;0,-10;0,0" dur="2.4s" begin="2.0s" repeatCount="indefinite"/>
          <polygon points="0,-34 30,-17 30,17 0,34 -30,17 -30,-17" fill="url(#win)" filter="url(#glow2)"/>
          <rect x="-13" y="-13" width="12" height="12" fill="#fff" opacity="0.9"/>
          <rect x="1" y="-13" width="12" height="12" fill="#fff" opacity="0.9"/>
          <rect x="-13" y="1" width="12" height="12" fill="#fff" opacity="0.9"/>
          <rect x="1" y="1" width="12" height="12" fill="#fff" opacity="0.9"/>
        </g>
        <text y="58" font-size="13" filter="url(#glow2)">Windows</text>
      </g>

    </g>
  </g>
</svg>

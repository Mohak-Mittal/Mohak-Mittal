<svg width="900" height="460" viewBox="0 0 900 460" xmlns="http://www.w3.org/2000/svg" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="cyberBg2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#7b2ff7">
        <animate attributeName="stop-color" values="#7b2ff7;#00c6ff;#ff2b6f;#ffb347;#00e5c8;#7b2ff7" dur="10s" repeatCount="indefinite"/>
      </stop>
      <stop offset="50%" stop-color="#00c6ff">
        <animate attributeName="stop-color" values="#00c6ff;#ff2b6f;#ffb347;#00e5c8;#7b2ff7;#00c6ff" dur="10s" repeatCount="indefinite"/>
      </stop>
      <stop offset="100%" stop-color="#ff2b6f">
        <animate attributeName="stop-color" values="#ff2b6f;#ffb347;#00e5c8;#7b2ff7;#00c6ff;#ff2b6f" dur="10s" repeatCount="indefinite"/>
      </stop>
    </linearGradient>

    <pattern id="grid2" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#a855f7" stroke-width="0.5" opacity="0.18"/>
    </pattern>

    <clipPath id="roundedFrame2">
      <rect x="0" y="0" width="900" height="460" rx="22"/>
    </clipPath>

    <filter id="glow2" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="5" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>

    <radialGradient id="hexPad" cx="50%" cy="35%" r="70%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.08"/>
    </radialGradient>
  </defs>

  <g clip-path="url(#roundedFrame2)">
    <rect width="900" height="460" fill="url(#cyberBg2)"/>
    <rect width="900" height="460" fill="url(#grid2)"/>

    <g stroke="#ffffff" stroke-width="2" opacity="0.6" fill="none">
      <path d="M 20,50 L 20,20 L 50,20"/>
      <path d="M 850,20 L 880,20 L 880,50"/>
      <path d="M 880,410 L 880,440 L 850,440"/>
      <path d="M 50,440 L 20,440 L 20,410"/>
    </g>

    <g font-family="Consolas, 'Courier New', monospace" text-anchor="middle" fill="#ffffff">
      <text x="450" y="52" font-size="30" font-weight="bold" filter="url(#glow2)">🛠️ TECH STACK</text>
      <text x="450" y="78" font-size="14" opacity="0.9" filter="url(#glow2)">Languages, engines &amp; tools I use daily</text>
    </g>

    <!--
      10 icons, 2 rows of 5, evenly spaced (row centers at x = 130, 302.5, 475, 647.5, 820).
      Each: floating hex pad (translucent) + real embedded logo image + label, staggered bob loop.
    -->
    <g font-family="Consolas, monospace" text-anchor="middle" fill="#ffffff">

      <!-- Row 1 -->
      <g transform="translate(130,190)">
        <g><animateTransform attributeName="transform" type="translate" values="0,0;0,-10;0,0" dur="2.4s" begin="0s" repeatCount="indefinite"/>
          <polygon points="0,-34 30,-17 30,17 0,34 -30,17 -30,-17" fill="url(#hexPad)" filter="url(#glow2)"/>
          <image href="https://skillicons.dev/icons?i=cpp" x="-22" y="-22" width="44" height="44"/>
        </g>
        <text y="58" font-size="13" filter="url(#glow2)">C++</text>
      </g>

      <g transform="translate(302,190)">
        <g><animateTransform attributeName="transform" type="translate" values="0,0;0,-10;0,0" dur="2.4s" begin="0.24s" repeatCount="indefinite"/>
          <polygon points="0,-34 30,-17 30,17 0,34 -30,17 -30,-17" fill="url(#hexPad)" filter="url(#glow2)"/>
          <image href="https://skillicons.dev/icons?i=py" x="-22" y="-22" width="44" height="44"/>
        </g>
        <text y="58" font-size="13" filter="url(#glow2)">Python</text>
      </g>

      <g transform="translate(475,190)">
        <g><animateTransform attributeName="transform" type="translate" values="0,0;0,-10;0,0" dur="2.4s" begin="0.48s" repeatCount="indefinite"/>
          <polygon points="0,-34 30,-17 30,17 0,34 -30,17 -30,-17" fill="url(#hexPad)" filter="url(#glow2)"/>
          <image href="https://skillicons.dev/icons?i=java" x="-22" y="-22" width="44" height="44"/>
        </g>
        <text y="58" font-size="13" filter="url(#glow2)">Java</text>
      </g>

      <g transform="translate(647,190)">
        <g><animateTransform attributeName="transform" type="translate" values="0,0;0,-10;0,0" dur="2.4s" begin="0.72s" repeatCount="indefinite"/>
          <polygon points="0,-34 30,-17 30,17 0,34 -30,17 -30,-17" fill="url(#hexPad)" filter="url(#glow2)"/>
          <image href="https://skillicons.dev/icons?i=unreal" x="-22" y="-22" width="44" height="44"/>
        </g>
        <text y="58" font-size="13" filter="url(#glow2)">Unreal</text>
      </g>

      <g transform="translate(820,190)">
        <g><animateTransform attributeName="transform" type="translate" values="0,0;0,-10;0,0" dur="2.4s" begin="0.96s" repeatCount="indefinite"/>
          <polygon points="0,-34 30,-17 30,17 0,34 -30,17 -30,-17" fill="url(#hexPad)" filter="url(#glow2)"/>
          <image href="https://skillicons.dev/icons?i=blender" x="-22" y="-22" width="44" height="44"/>
        </g>
        <text y="58" font-size="13" filter="url(#glow2)">Blender</text>
      </g>

      <!-- Row 2 -->
      <g transform="translate(130,340)">
        <g><animateTransform attributeName="transform" type="translate" values="0,0;0,-10;0,0" dur="2.4s" begin="1.2s" repeatCount="indefinite"/>
          <polygon points="0,-34 30,-17 30,17 0,34 -30,17 -30,-17" fill="url(#hexPad)" filter="url(#glow2)"/>
          <image href="https://skillicons.dev/icons?i=visualstudio" x="-22" y="-22" width="44" height="44"/>
        </g>
        <text y="58" font-size="13" filter="url(#glow2)">Studio</text>
      </g>

      <g transform="translate(302,340)">
        <g><animateTransform attributeName="transform" type="translate" values="0,0;0,-10;0,0" dur="2.4s" begin="1.44s" repeatCount="indefinite"/>
          <polygon points="0,-34 30,-17 30,17 0,34 -30,17 -30,-17" fill="url(#hexPad)" filter="url(#glow2)"/>
          <image href="https://skillicons.dev/icons?i=git" x="-22" y="-22" width="44" height="44"/>
        </g>
        <text y="58" font-size="13" filter="url(#glow2)">Git</text>
      </g>

      <g transform="translate(475,340)">
        <g><animateTransform attributeName="transform" type="translate" values="0,0;0,-10;0,0" dur="2.4s" begin="1.68s" repeatCount="indefinite"/>
          <polygon points="0,-34 30,-17 30,17 0,34 -30,17 -30,-17" fill="url(#hexPad)" filter="url(#glow2)"/>
          <image href="https://skillicons.dev/icons?i=github" x="-22" y="-22" width="44" height="44"/>
        </g>
        <text y="58" font-size="13" filter="url(#glow2)">GitHub</text>
      </g>

      <g transform="translate(647,340)">
        <g><animateTransform attributeName="transform" type="translate" values="0,0;0,-10;0,0" dur="2.4s" begin="1.92s" repeatCount="indefinite"/>
          <polygon points="0,-34 30,-17 30,17 0,34 -30,17 -30,-17" fill="url(#hexPad)" filter="url(#glow2)"/>
          <image href="https://skillicons.dev/icons?i=html" x="-22" y="-22" width="44" height="44"/>
        </g>
        <text y="58" font-size="13" filter="url(#glow2)">HTML5</text>
      </g>

      <g transform="translate(820,340)">
        <g><animateTransform attributeName="transform" type="translate" values="0,0;0,-10;0,0" dur="2.4s" begin="2.16s" repeatCount="indefinite"/>
          <polygon points="0,-34 30,-17 30,17 0,34 -30,17 -30,-17" fill="url(#hexPad)" filter="url(#glow2)"/>
          <image href="https://skillicons.dev/icons?i=windows" x="-22" y="-22" width="44" height="44"/>
        </g>
        <text y="58" font-size="13" filter="url(#glow2)">Windows</text>
      </g>

    </g>
  </g>
</svg>

<svg width="900" height="620" viewBox="0 0 900 620" xmlns="http://www.w3.org/2000/svg" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <radialGradient id="coreGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#e9d5ff" stop-opacity="0.9"/>
      <stop offset="35%" stop-color="#a855f7" stop-opacity="0.55"/>
      <stop offset="70%" stop-color="#6d28d9" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#6d28d9" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="nodeFill" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#c084fc"/>
      <stop offset="100%" stop-color="#4c1d95"/>
    </linearGradient>
    <filter id="softGlow" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="5" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>

    <linearGradient id="cyberBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0518">
        <animate attributeName="stop-color" values="#0a0518;#150a30;#0a1a33;#0a0518" dur="12s" repeatCount="indefinite"/>
      </stop>
      <stop offset="50%" stop-color="#150a30">
        <animate attributeName="stop-color" values="#150a30;#0a1a33;#1a0a3d;#150a30" dur="12s" repeatCount="indefinite"/>
      </stop>
      <stop offset="100%" stop-color="#0a1a33">
        <animate attributeName="stop-color" values="#0a1a33;#1a0a3d;#0a0518;#0a1a33" dur="12s" repeatCount="indefinite"/>
      </stop>
    </linearGradient>

    <pattern id="cyberGrid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#a855f7" stroke-width="0.5" opacity="0.18"/>
    </pattern>
  </defs>

  <rect width="900" height="620" fill="url(#cyberBg)"/>
  <rect width="900" height="620" fill="url(#cyberGrid)"/>

  <!-- scanline sweep -->
  <rect x="0" y="0" width="900" height="3" fill="#c084fc" opacity="0.25">
    <animate attributeName="y" values="0;620;0" dur="6s" repeatCount="indefinite"/>
  </rect>

  <!-- HUD corner brackets -->
  <g stroke="#c084fc" stroke-width="2" opacity="0.6" fill="none">
    <path d="M 20,50 L 20,20 L 50,20"/>
    <path d="M 850,20 L 880,20 L 880,50"/>
    <path d="M 880,570 L 880,600 L 850,600"/>
    <path d="M 50,600 L 20,600 L 20,570"/>
  </g>

  <!-- ambient glow -->
  <circle cx="450" cy="310" r="230" fill="url(#coreGlow)">
    <animate attributeName="r" values="220;240;220" dur="4s" repeatCount="indefinite"/>
  </circle>

  <!-- rotating hologram rings -->
  <g stroke="#c084fc" fill="none">
    <circle cx="450" cy="310" r="110" opacity="0.55" stroke-width="1.5" stroke-dasharray="6 10">
      <animateTransform attributeName="transform" type="rotate" from="0 450 310" to="360 450 310" dur="14s" repeatCount="indefinite"/>
    </circle>
    <circle cx="450" cy="310" r="140" opacity="0.35" stroke-width="1" stroke-dasharray="2 8">
      <animateTransform attributeName="transform" type="rotate" from="360 450 310" to="0 450 310" dur="20s" repeatCount="indefinite"/>
    </circle>
    <ellipse cx="450" cy="310" rx="150" ry="55" opacity="0.4" stroke-width="1">
      <animate attributeName="opacity" values="0.2;0.5;0.2" dur="3s" repeatCount="indefinite"/>
    </ellipse>
  </g>

  <!-- core -->
  <circle cx="450" cy="310" r="70" fill="url(#nodeFill)" opacity="0.9" filter="url(#softGlow)">
    <animate attributeName="opacity" values="0.75;0.95;0.75" dur="2.6s" repeatCount="indefinite"/>
  </circle>
  <text x="450" y="316" text-anchor="middle" font-family="Consolas, monospace" font-size="16" fill="#f5f0ff" font-weight="bold">SKILLS</text>

  <!-- connecting lines + skill nodes, radiating outward -->
  <!--
    8 nodes around the circle at radius 260, staggered pulse animation.
    Each node: line to core, icon circle, label (skill name), and a "more info" tspan that
    fades in only while the node is enlarged - simulating the hover reveal automatically.
  -->

  <!-- node template values: angle(deg), label, sub, color -->

  <!-- Node 1: 270deg (top) - C++ -->
  <g>
    <line x1="450" y1="310" x2="450" y2="90" stroke="#a855f7" stroke-width="1.5" stroke-dasharray="4 4" opacity="0.5">
      <animate attributeName="stroke-dashoffset" values="0;-16" dur="1.5s" repeatCount="indefinite"/>
    </line>
    <g transform="translate(450,90)">
      <g>
        <animateTransform attributeName="transform" type="scale" values="1;1;1.45;1;1" keyTimes="0;0.05;0.2;0.35;1" dur="8s" begin="0s" repeatCount="indefinite"/>
        <circle r="28" fill="url(#nodeFill)" filter="url(#softGlow)"/>
        <text text-anchor="middle" y="6" font-family="Consolas, monospace" font-size="18" font-weight="bold" fill="#fff">C++</text>
      </g>
      <text text-anchor="middle" y="-40" font-family="Consolas, monospace" font-size="13" fill="#e9d5ff" opacity="0">
        3+ yrs · game dev core
        <animate attributeName="opacity" values="0;0;1;0;0" keyTimes="0;0.05;0.2;0.35;1" dur="8s" begin="0s" repeatCount="indefinite"/>
      </text>
    </g>
  </g>

  <!-- Node 2: 315deg - Unreal Engine -->
  <g>
    <line x1="450" y1="310" x2="605" y2="145" stroke="#a855f7" stroke-width="1.5" stroke-dasharray="4 4" opacity="0.5">
      <animate attributeName="stroke-dashoffset" values="0;-16" dur="1.5s" repeatCount="indefinite"/>
    </line>
    <g transform="translate(605,145)">
      <g>
        <animateTransform attributeName="transform" type="scale" values="1;1;1.45;1;1" keyTimes="0;0.05;0.2;0.35;1" dur="8s" begin="1s" repeatCount="indefinite"/>
        <circle r="28" fill="url(#nodeFill)" filter="url(#softGlow)"/>
        <text text-anchor="middle" y="6" font-family="Consolas, monospace" font-size="17" font-weight="bold" fill="#fff">UE5</text>
      </g>
      <text text-anchor="middle" y="-40" font-family="Consolas, monospace" font-size="13" fill="#e9d5ff" opacity="0">
        Building Horror_Game
        <animate attributeName="opacity" values="0;0;1;0;0" keyTimes="0;0.05;0.2;0.35;1" dur="8s" begin="1s" repeatCount="indefinite"/>
      </text>
    </g>
  </g>

  <!-- Node 3: 0deg (right) - Blender -->
  <g>
    <line x1="450" y1="310" x2="700" y2="310" stroke="#a855f7" stroke-width="1.5" stroke-dasharray="4 4" opacity="0.5">
      <animate attributeName="stroke-dashoffset" values="0;-16" dur="1.5s" repeatCount="indefinite"/>
    </line>
    <g transform="translate(700,310)">
      <g>
        <animateTransform attributeName="transform" type="scale" values="1;1;1.45;1;1" keyTimes="0;0.05;0.2;0.35;1" dur="8s" begin="2s" repeatCount="indefinite"/>
        <circle r="28" fill="url(#nodeFill)" filter="url(#softGlow)"/>
        <text text-anchor="middle" y="6" font-family="Consolas, monospace" font-size="15" font-weight="bold" fill="#fff">3D</text>
      </g>
      <text text-anchor="middle" y="-40" font-family="Consolas, monospace" font-size="13" fill="#e9d5ff" opacity="0">
        Blender · asset work
        <animate attributeName="opacity" values="0;0;1;0;0" keyTimes="0;0.05;0.2;0.35;1" dur="8s" begin="2s" repeatCount="indefinite"/>
      </text>
    </g>
  </g>

  <!-- Node 4: 45deg - AI/VRM -->
  <g>
    <line x1="450" y1="310" x2="605" y2="475" stroke="#a855f7" stroke-width="1.5" stroke-dasharray="4 4" opacity="0.5">
      <animate attributeName="stroke-dashoffset" values="0;-16" dur="1.5s" repeatCount="indefinite"/>
    </line>
    <g transform="translate(605,475)">
      <g>
        <animateTransform attributeName="transform" type="scale" values="1;1;1.45;1;1" keyTimes="0;0.05;0.2;0.35;1" dur="8s" begin="3s" repeatCount="indefinite"/>
        <circle r="28" fill="url(#nodeFill)" filter="url(#softGlow)"/>
        <text text-anchor="middle" y="6" font-family="Consolas, monospace" font-size="16" font-weight="bold" fill="#fff">AI</text>
      </g>
      <text text-anchor="middle" y="-40" font-family="Consolas, monospace" font-size="13" fill="#e9d5ff" opacity="0">
        VRM companion app
        <animate attributeName="opacity" values="0;0;1;0;0" keyTimes="0;0.05;0.2;0.35;1" dur="8s" begin="3s" repeatCount="indefinite"/>
      </text>
    </g>
  </g>

  <!-- Node 5: 90deg (bottom) - Python -->
  <g>
    <line x1="450" y1="310" x2="450" y2="530" stroke="#a855f7" stroke-width="1.5" stroke-dasharray="4 4" opacity="0.5">
      <animate attributeName="stroke-dashoffset" values="0;-16" dur="1.5s" repeatCount="indefinite"/>
    </line>
    <g transform="translate(450,530)">
      <g>
        <animateTransform attributeName="transform" type="scale" values="1;1;1.45;1;1" keyTimes="0;0.05;0.2;0.35;1" dur="8s" begin="4s" repeatCount="indefinite"/>
        <circle r="28" fill="url(#nodeFill)" filter="url(#softGlow)"/>
        <text text-anchor="middle" y="6" font-family="Consolas, monospace" font-size="14" font-weight="bold" fill="#fff">PY</text>
      </g>
      <text text-anchor="middle" y="45" font-family="Consolas, monospace" font-size="13" fill="#e9d5ff" opacity="0">
        Scripting &amp; tooling
        <animate attributeName="opacity" values="0;0;1;0;0" keyTimes="0;0.05;0.2;0.35;1" dur="8s" begin="4s" repeatCount="indefinite"/>
      </text>
    </g>
  </g>

  <!-- Node 6: 135deg - Web -->
  <g>
    <line x1="450" y1="310" x2="295" y2="475" stroke="#a855f7" stroke-width="1.5" stroke-dasharray="4 4" opacity="0.5">
      <animate attributeName="stroke-dashoffset" values="0;-16" dur="1.5s" repeatCount="indefinite"/>
    </line>
    <g transform="translate(295,475)">
      <g>
        <animateTransform attributeName="transform" type="scale" values="1;1;1.45;1;1" keyTimes="0;0.05;0.2;0.35;1" dur="8s" begin="5s" repeatCount="indefinite"/>
        <circle r="28" fill="url(#nodeFill)" filter="url(#softGlow)"/>
        <text text-anchor="middle" y="6" font-family="Consolas, monospace" font-size="12" font-weight="bold" fill="#fff">WEB</text>
      </g>
      <text text-anchor="middle" y="45" font-family="Consolas, monospace" font-size="13" fill="#e9d5ff" opacity="0">
        Portfolio &amp; FitForge
        <animate attributeName="opacity" values="0;0;1;0;0" keyTimes="0;0.05;0.2;0.35;1" dur="8s" begin="5s" repeatCount="indefinite"/>
      </text>
    </g>
  </g>

  <!-- Node 7: 180deg (left) - Git -->
  <g>
    <line x1="450" y1="310" x2="200" y2="310" stroke="#a855f7" stroke-width="1.5" stroke-dasharray="4 4" opacity="0.5">
      <animate attributeName="stroke-dashoffset" values="0;-16" dur="1.5s" repeatCount="indefinite"/>
    </line>
    <g transform="translate(200,310)">
      <g>
        <animateTransform attributeName="transform" type="scale" values="1;1;1.45;1;1" keyTimes="0;0.05;0.2;0.35;1" dur="8s" begin="6s" repeatCount="indefinite"/>
        <circle r="28" fill="url(#nodeFill)" filter="url(#softGlow)"/>
        <text text-anchor="middle" y="6" font-family="Consolas, monospace" font-size="15" font-weight="bold" fill="#fff">GIT</text>
      </g>
      <text text-anchor="middle" y="-40" font-family="Consolas, monospace" font-size="13" fill="#e9d5ff" opacity="0">
        Version control daily
        <animate attributeName="opacity" values="0;0;1;0;0" keyTimes="0;0.05;0.2;0.35;1" dur="8s" begin="6s" repeatCount="indefinite"/>
      </text>
    </g>
  </g>

  <!-- Node 8: 225deg - Design/UI -->
  <g>
    <line x1="450" y1="310" x2="295" y2="145" stroke="#a855f7" stroke-width="1.5" stroke-dasharray="4 4" opacity="0.5">
      <animate attributeName="stroke-dashoffset" values="0;-16" dur="1.5s" repeatCount="indefinite"/>
    </line>
    <g transform="translate(295,145)">
      <g>
        <animateTransform attributeName="transform" type="scale" values="1;1;1.45;1;1" keyTimes="0;0.05;0.2;0.35;1" dur="8s" begin="7s" repeatCount="indefinite"/>
        <circle r="28" fill="url(#nodeFill)" filter="url(#softGlow)"/>
        <text text-anchor="middle" y="6" font-family="Consolas, monospace" font-size="12" font-weight="bold" fill="#fff">UI/UX</text>
      </g>
      <text text-anchor="middle" y="-40" font-family="Consolas, monospace" font-size="13" fill="#e9d5ff" opacity="0">
        HUD &amp; game UI design
        <animate attributeName="opacity" values="0;0;1;0;0" keyTimes="0;0.05;0.2;0.35;1" dur="8s" begin="7s" repeatCount="indefinite"/>
      </text>
    </g>
  </g>

</svg>
